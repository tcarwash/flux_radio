name: Experimental macOS starter firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  starter:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [base, scan, designer-scan]
        tx: [ce, fcc]
        include:
          - profile: base
            packs: base
          - profile: scan
            packs: base scan
          - profile: designer-scan
            packs: base scan designer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native and embedded build tools
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --target thumbv6m-none-eabi
          python -m pip install -r requirements-dev.txt
      - name: Record host and toolchain
        run: |
          sw_vers
          uname -m
          python --version
          clang --version
          ld.lld --version
          rustc --version
      - name: Build, inspect and verify extracted starter
        run: |
          python tools/k6.py build ${{ matrix.packs }} --tx-profile ${{ matrix.tx }} --output firmware/k6-aura/out-fd6818b/starter
          python tools/k6.py inspect firmware/k6-aura/out-fd6818b/starter
          python tools/k6_starter_release.py ${{ matrix.profile }} firmware/k6-aura/out-fd6818b/starter dist/flux-macos-fd6818b-${{ matrix.profile }}-${{ matrix.tx }}.zip
          python tools/k6_validate_starter.py dist/flux-macos-fd6818b-${{ matrix.profile }}-${{ matrix.tx }}.zip
      - name: Execute firmware in the emulator
        run: |
          python -m sim.k6emu firmware/k6-aura/out-fd6818b/starter/firmware.bin --instructions 2000000 --report-json dist/emulator.json
          python -c 'import json; report = json.load(open("dist/emulator.json")); assert report["fault"] is None, report["fault"]; assert report["run"]["instructions"] == 2000000'
      - uses: actions/upload-artifact@v4
        with:
          name: flux-macos-fd6818b-${{ matrix.profile }}-${{ matrix.tx }}
          path: dist/*
